<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Panelistan">
  <defs>
    <!-- Sekiz köşeli yıldız: iki karenin birleşimi, çıtaları kırpar -->
    <clipPath id="pnl-star">
      <rect x="12" y="12" width="40" height="40" rx="2.5" />
      <rect x="12" y="12" width="40" height="40" rx="2.5" transform="rotate(45 32 32)" />
    </clipPath>
  </defs>

  <!-- Örgü fırıldak: tek çıta, 90°'lik dönüşlerle dört kez tekrarlanır -->
  <g clip-path="url(#pnl-star)">
    <g transform="rotate(45 32 32)">
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#8B5A2B" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" transform="rotate(90 32 32)" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#8B5A2B" transform="rotate(180 32 32)" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" transform="rotate(270 32 32)" />
    </g>
  </g>

  <!-- Yıldız çerçeve -->
  <g stroke="#3D2914" stroke-width="3.2" stroke-linejoin="round">
    <rect x="12" y="12" width="40" height="40" rx="2.5" />
    <rect x="12" y="12" width="40" height="40" rx="2.5" transform="rotate(45 32 32)" />
  </g>
</svg>
