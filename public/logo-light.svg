<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" role="img" aria-label="Panelistan">
  <defs>
    <!-- Koyu zemin varyantı: aynı geometri, açık renkler -->
    <clipPath id="pnl-star-light">
      <rect x="12" y="12" width="40" height="40" rx="2.5" />
      <rect x="12" y="12" width="40" height="40" rx="2.5" transform="rotate(45 32 32)" />
    </clipPath>
  </defs>

  <g clip-path="url(#pnl-star-light)">
    <g transform="rotate(45 32 32)">
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#D4A574" transform="rotate(90 32 32)" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" transform="rotate(180 32 32)" />
      <rect x="-2" y="12.5" width="39.2" height="13" fill="#D4A574" transform="rotate(270 32 32)" />
    </g>
  </g>

  <g stroke="#E8D5C4" stroke-width="3.2" stroke-linejoin="round">
    <rect x="12" y="12" width="40" height="40" rx="2.5" />
    <rect x="12" y="12" width="40" height="40" rx="2.5" transform="rotate(45 32 32)" />
  </g>
</svg>
