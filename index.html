<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#3D2914" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panelistan — Doğal Ahşap Tasarım</title>
    <meta
      name="description"
      content="El yapımı, doğal ahşap dekor ürünleri ile yaşam alanlarınıza sıcaklık katıyoruz. Ölçüye özel panel ve ahşap tasarım ürünleri."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />
    <style>
      /* Marka logolu açılış yükleme ekranı — JS paketi inmeden önce anında görünür */
      #app-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FAF6F0;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #app-loader.app-loader--hidden {
        opacity: 0;
        visibility: hidden;
      }
      .app-loader__box {
        position: relative;
        width: 92px;
        height: 92px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-loader__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(198, 125, 74, 0.2);
        border-top-color: #C67D4A;
        animation: app-loader-spin 0.9s linear infinite;
      }
      .app-loader__logo {
        width: 58px;
        height: 58px;
        animation: app-loader-pulse 1.6s ease-in-out infinite;
      }
      .app-loader__brand {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 20px;
        letter-spacing: 0.08em;
        color: #3D2914;
        opacity: 0.85;
      }
      @keyframes app-loader-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes app-loader-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loader__ring, .app-loader__logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-loader">
      <div class="app-loader__box">
        <div class="app-loader__ring"></div>
        <!-- public/favicon.svg ile aynı şekil — biri değişirse diğeri de güncellenmeli -->
        <svg class="app-loader__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
          <defs>
            <clipPath id="app-loader-star">
              <rect x="14" y="14" width="36" height="36" rx="2" />
              <rect x="14" y="14" width="36" height="36" rx="2" transform="rotate(45 32 32)" />
            </clipPath>
          </defs>
          <g fill="#3D2914">
            <rect x="10" y="10" width="44" height="44" rx="3" />
            <rect x="10" y="10" width="44" height="44" rx="3" transform="rotate(45 32 32)" />
          </g>
          <g clip-path="url(#app-loader-star)">
            <g transform="rotate(45 32 32)">
              <rect x="-2" y="12.5" width="39.2" height="13" fill="#D4A574" />
              <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" transform="rotate(90 32 32)" />
              <rect x="-2" y="12.5" width="39.2" height="13" fill="#D4A574" transform="rotate(180 32 32)" />
              <rect x="-2" y="12.5" width="39.2" height="13" fill="#C67D4A" transform="rotate(270 32 32)" />
            </g>
          </g>
        </svg>
      </div>
      <div class="app-loader__brand">Panelistan</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
